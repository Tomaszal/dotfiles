# Tracks upstream binary releases that nixpkgs/flakes do not package
#
# Regenerate _sources after editing, or to pick up new upstream releases:
# moon run repo:nvfetcher

[figma-desktop]
src.github = "IliyaBrook/figma-linux"
fetch.url = "https://github.com/IliyaBrook/figma-linux/releases/download/$ver/figma-desktop-$ver-amd64.AppImage"

[codexbar]
src.github = "steipete/CodexBar"
fetch.url = "https://github.com/steipete/CodexBar/releases/download/$ver/CodexBarCLI-$ver-linux-x86_64.tar.gz"

[pulls-review]
src.github = "antfu/pulls.review"
src.prefix = "v"
fetch.url = "https://github.com/antfu/pulls.review/archive/refs/tags/v$ver.tar.gz"
