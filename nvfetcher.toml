# Tracks upstream releases that nixpkgs/flakes do not package
#
# Regenerate _sources after editing, or to pick up new upstream releases:
# moon run repo:nvfetcher

[asyraf-agent-skills]
src.github = "AsyrafHussin/agent-skills"
fetch.github = "AsyrafHussin/agent-skills"

[figma-desktop]
src.github = "IliyaBrook/figma-linux"
fetch.url = "https://github.com/IliyaBrook/figma-linux/releases/download/$ver/figma-desktop-$ver-amd64.AppImage"

[i-have-adhd]
src.github = "ayghri/i-have-adhd"
fetch.github = "ayghri/i-have-adhd"

[pulls-review]
src.github = "antfu/pulls.review"
src.prefix = "v"
fetch.url = "https://github.com/antfu/pulls.review/archive/refs/tags/v$ver.tar.gz"

[ponytail]
src.github = "DietrichGebert/ponytail"
fetch.github = "DietrichGebert/ponytail"

[sweethome3d-mcp-plugin]
src.github = "grimashevich/sweethome3d-mcp-server"
src.prefix = "v"
fetch.url = "https://github.com/grimashevich/sweethome3d-mcp-server/releases/download/v$ver/sh3d-mcp-plugin-$ver.sh3p"

[visual-explainer]
src.github = "nicobailon/visual-explainer"
fetch.github = "nicobailon/visual-explainer"
