$schema: ./.moon/cache/schemas/project.json

tasks:
  bootstrap:
    description: Prepare the repository for development.
    deps:
      - moon/generate-schemas
      - agents/sync
    preset: utility

  nixos/build:
    description: Build the current host configuration.
    command: nh os build .
    deps:
      - flake/generate
    preset: utility

  nixos/switch:
    description: Apply the current host configuration.
    command: nh os switch .
    deps:
      - flake/generate
    preset: utility

  nixos/installer:
    command: nix build .#installer
    deps:
      - flake/generate
    preset: utility

  nix/format:
    command: nix fmt .
    preset: utility

  flake/generate:
    command: nix run .#write-flake
    preset: utility

  flake/update:
    command: nix flake update
    deps:
      - flake/generate
      - target: rehash
        type: cleanup
    preset: utility

  moon/generate-schemas:
    command: moon sync config-schemas
    preset: utility

  nvfetcher:
    command: nvfetcher
    deps:
      - target: rehash
        type: cleanup
    preset: utility

  rehash:
    deps:
      - target: rehash/pulls-review
        type: cleanup
    preset: utility

  rehash/pulls-review:
    command: nix-update --flake --version=skip --no-src pulls-review-runtime
    deps:
      - target: nix/format
        type: cleanup
    preset: utility

  check:
    deps:
      - agents/check

  fix:
    deps:
      - nix/format
    preset: utility

  update:
    description: Update all project dependencies.
    deps:
      - flake/update
      - nvfetcher
      - agents/update
    preset: utility

  agents/check:
    command: apm compile --validate
    inputs:
      - .apm/**/*
      - apm.yml
      - apm.lock.yaml
      - flake.lock

  agents/sync:
    description: Apply repository agent configuration.
    script: |
      set -e
      apm install
      apm compile --clean
    preset: utility

  agents/update:
    command: apm lock
    preset: utility
